# Fragment for config/deploy.yml; replace placeholders before use.
accessories:
  escalator:
    image: registry.example.com/escalator:REPLACE_WITH_IMMUTABLE_VERSION
    host: 192.0.2.10
    network: kamal
    env:
      clear:
        PORT: "3000"
        ESCALATOR_WORKSPACE_ID: "REPLACE_WITH_WORKSPACE_ID"
        ESCALATOR_PUBLIC_URL: "https://oncall.example.com"
        ESCALATOR_TRUST_PROXY_HOPS: "1"
        ESCALATOR_SECRET_KEY_FILE: /run/escalator/keyring.json
        ESCALATOR_AUTH_GRANT_FILE: /run/escalator/operator/bootstrap.txt
      secret:
        - ESCALATOR_DATABASE_URL
    files:
      - local: .deploy/escalator-keyring.json
        remote: /run/escalator/keyring.json
        mode: "0400"
        owner: "1000:1000"
        options: ro
    directories:
      - local: escalator-operator
        remote: /run/escalator/operator
        mode: "0700"
        owner: "1000:1000"
    proxy:
      host: oncall.example.com
      ssl: true
      forward_headers: true
      app_port: 3000
      healthcheck:
        path: /health/live
        interval: 3
        timeout: 3
  escalator-db:
    image: postgres:17-bookworm
    host: 192.0.2.10
    network: kamal
    env:
      clear:
        POSTGRES_DB: escalator
        POSTGRES_USER: postgres
      secret:
        - POSTGRES_PASSWORD
    files:
      - local: apps/escalator/deploy/roles.sh
        remote: /docker-entrypoint-initdb.d/10-escalator-roles.sh
        mode: "0444"
        options: ro
      - local: .deploy/escalator-migrator-password
        remote: /run/secrets/migrator_password
        mode: "0400"
        owner: "999:999"
        options: ro
      - local: .deploy/escalator-app-password
        remote: /run/secrets/app_password
        mode: "0400"
        owner: "999:999"
        options: ro
    directories:
      - local: escalator-postgres
        remote: /var/lib/postgresql/data
        mode: "0700"
        owner: "999:999"
